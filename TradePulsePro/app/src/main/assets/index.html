<!DOCTYPE html>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const DEFAULT_PORTFOLIO = [
      { id: "nvda-1", symbol: "NVDA", name: "Nvidia Corp.", envelope: "CTO", qty: 1.0, buyPriceEur: 145.02, currentPriceEur: 151.40, divPerShareEur: 0.17, nextDivDate: "23/12/2026" }
    ];

    const DEFAULT_STOCKS = [
      { symbol: "NVDA", name: "Nvidia", envelope: "CTO", currency: "USD", price: 162.56, priceEur: 151.40, high52w: 243.0, sma200: 176.4, rsi: 36.4, forwardPE: 21.4, divYield: 0.62, exDivDate: "02/12", targetBuyEur: 145.0, category: "Croissance IA", thesis: "Résultats Q3 records (115,8 Mds$), carnet de commandes de 2 500 Mds$ et 150 Mds$ de rachats d'actions." },
      { symbol: "TTE.PA", name: "TotalEnergies", envelope: "PEA", currency: "EUR", price: 56.40, priceEur: 56.40, high52w: 69.80, sma200: 61.20, rsi: 33.8, forwardPE: 7.4, divYield: 5.65, exDivDate: "02/01", targetBuyEur: 55.50, category: "Dividende PEA", thesis: "Pilier de rendement trimestriel éligible PEA, cours sous sa moyenne 200 jours avec fort rachat d'actions." },
      { symbol: "ASML.AS", name: "ASML Holding", envelope: "PEA", currency: "EUR", price: 642.0, priceEur: 642.0, high52w: 985.0, sma200: 765.0, rsi: 31.2, forwardPE: 24.8, divYield: 1.05, exDivDate: "28/01", targetBuyEur: 635.0, category: "Tech PEA", thesis: "Monopole mondial des machines EUV indispensables pour graver les puces IA de Nvidia et TSMC. Décote de -34%." },
      { symbol: "O", name: "Realty Income", envelope: "CTO", currency: "USD", price: 55.80, priceEur: 50.73, high52w: 64.80, sma200: 57.90, rsi: 38.5, forwardPE: 13.2, divYield: 5.48, exDivDate: "29/11", targetBuyEur: 50.00, category: "Loyer Mensuel", thesis: "La référence mondiale des foncières cotées (REIT) versant un dividende tous les mois depuis plus de 50 ans." },
      { symbol: "CS.PA", name: "AXA", envelope: "PEA", currency: "EUR", price: 33.10, priceEur: 33.10, high52w: 36.90, sma200: 33.80, rsi: 43.2, forwardPE: 8.9, divYield: 5.98, exDivDate: "05/05", targetBuyEur: 32.50, category: "Dividende PEA", thesis: "Rendement proche de 6 % sur PEA avec une excellente visibilité sur les flux de trésorerie." },
      { symbol: "EXCH.DE", name: "Xtrackers Euro Div ETF", envelope: "PEA", currency: "EUR", price: 24.15, priceEur: 24.15, high52w: 25.80, sma200: 23.90, rsi: 46.0, forwardPE: 11.2, divYield: 4.28, exDivDate: "15/02", targetBuyEur: 23.80, category: "ETF PEA", thesis: "Panier diversifié de 40 entreprises européennes à fort dividende, idéal en plan programmé à 0 € sur Trade Republic." },
      { symbol: "MSFT", name: "Microsoft", envelope: "CTO", currency: "USD", price: 418.0, priceEur: 380.0, high52w: 468.0, sma200: 425.0, rsi: 44.1, forwardPE: 28.5, divYield: 0.78, exDivDate: "19/02", targetBuyEur: 368.0, category: "Croissance IA", thesis: "Leader mondial Cloud Azure + Copilot, sous sa moyenne mobile 200 jours." },
      { symbol: "SAN.PA", name: "Sanofi", envelope: "PEA", currency: "EUR", price: 92.40, priceEur: 92.40, high52w: 105.5, sma200: 95.10, rsi: 39.8, forwardPE: 11.4, divYield: 4.10, exDivDate: "12/05", targetBuyEur: 90.00, category: "Dividende PEA", thesis: "Valeur défensive de santé éligible PEA avec plus de 30 ans de hausse ininterrompue du dividende." }
    ];

    const MONTHS = [
      { m: "Jan", sources: "TotalEnergies + Realty Income", weight: 1.1 },
      { m: "Fév", sources: "ETF Euro Div + Realty Income", weight: 1.2 },
      { m: "Mar", sources: "Nvidia + Realty Income", weight: 0.6 },
      { m: "Avr", sources: "TotalEnergies + Realty Income", weight: 1.1 },
      { m: "Mai", sources: "AXA + Sanofi + ETF + Realty Income", weight: 2.2 },
      { m: "Juin", sources: "Nvidia + Realty Income", weight: 0.6 },
      { m: "Juil", sources: "TotalEnergies + Realty Income", weight: 1.1 },
      { m: "Août", sources: "ETF Euro Div + Realty Income", weight: 1.2 },
      { m: "Sep", sources: "Nvidia + Realty Income", weight: 0.6 },
      { m: "Oct", sources: "TotalEnergies + Realty Income", weight: 1.1 },
      { m: "Nov", sources: "ETF Euro Div + Realty Income", weight: 1.1 },
      { m: "Déc", sources: "Nvidia (23/12) + Realty Income", weight: 0.8 }
    ];

    function computeScore(s) {
      const drawdown = ((s.price - s.high52w) / s.high52w) * 100;
      let score = 0;
      if (s.rsi < 33) score += 35;
      else if (s.rsi < 40) score += 25;
      else if (s.rsi < 48) score += 12;
      if (drawdown <= -25) score += 25;
      else if (drawdown <= -15) score += 18;
      else if (drawdown <= -10) score += 10;
      if (s.price <= s.sma200) score += 10;
      if (s.divYield >= 4.5) score += 20;
      else if (s.divYield >= 2.5) score += 10;
      if (s.forwardPE > 0 && s.forwardPE < 22) score += 10;
      return { score: Math.min(100, score), drawdown };
    }

    function App() {
      const [tab, setTab] = useState("portfolio");
      const [portfolio, setPortfolio] = useState(() => {
        const saved = localStorage.getItem("tp_portfolio_v3");
        return saved ? JSON.parse(saved) : DEFAULT_PORTFOLIO;
      });
      const [stocks, setStocks] = useState(DEFAULT_STOCKS);
      const [nvdaPriceEur, setNvdaPriceEur] = useState(151.40);
      const [targetSellEur, setTargetSellEur] = useState(185.00);
      const [taxMode, setTaxMode] = useState("CTO"); // CTO (30%) or PEA (17.2%)
      const [filter, setFilter] = useState("ALL");
      const [selectedStock, setSelectedStock] = useState(null);
      const [monthlySaving, setMonthlySaving] = useState(225);
      const [cardSpend, setCardSpend] = useState(800);
      const [years, setYears] = useState(10);
      const [profileType, setProfileType] = useState("EQUILIBRE");

      // AI Tab State
      const [aiMode, setAiMode] = useState("EMBEDDED"); // EMBEDDED or CLOUD
      const [apiKey, setApiKey] = useState(() => localStorage.getItem("tp_gemini_key") || "");
      const [chatInput, setChatInput] = useState("");
      const [chatHistory, setChatHistory] = useState([
        { role: "ai", text: "Salut Victor ! Ton moteur quantitatif V3 est actif. Ta ligne Nvidia achetée à 145,02 € est suivie en direct, et tes plans d'épargne 150–300 €/mois sont calibrés. Pose-moi une question ou clique sur un bouton rapide ci-dessous !" }
      ]);
      const [isLoadingAi, setIsLoadingAi] = useState(false);
      const [isRefreshing, setIsRefreshing] = useState(false);

      useEffect(() => {
        localStorage.setItem("tp_portfolio_v3", JSON.stringify(portfolio));
      }, [portfolio]);

      useEffect(() => {
        localStorage.setItem("tp_gemini_key", apiKey);
      }, [apiKey]);

      // Sync Nvidia price in portfolio
      useEffect(() => {
        setPortfolio(prev => prev.map(p => p.symbol === "NVDA" ? { ...p, currentPriceEur: nvdaPriceEur } : p));
      }, [nvdaPriceEur]);

      // Live Yahoo Finance refresh via public CORS proxy fallback
      const refreshLivePrices = async () => {
        setIsRefreshing(true);
        try {
          const symbols = ["NVDA", "TTE.PA", "ASML.AS", "O", "CS.PA", "MSFT", "SAN.PA"];
          const updated = [...stocks];
          for (const sym of symbols) {
            try {
              const url = `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=5d`;
              const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
              const res = await fetch(proxyUrl);
              const data = await res.json();
              const parsed = JSON.parse(data.contents);
              const close = parsed.chart.result[0].meta.regularMarketPrice;
              if (close) {
                const idx = updated.findIndex(s => s.symbol === sym);
                if (idx !== -1) {
                  updated[idx].price = close;
                  updated[idx].priceEur = updated[idx].currency === "USD" ? +(close / 1.08).toFixed(2) : +close.toFixed(2);
                  if (sym === "NVDA") setNvdaPriceEur(updated[idx].priceEur);
                }
              }
            } catch (e) {}
          }
          setStocks(updated);
        } finally {
          setIsRefreshing(false);
        }
      };

      const buyPrice = 145.02;
      const fees = 2.00;
      const taxRate = taxMode === "CTO" ? 0.30 : 0.172;
      const currentGross = nvdaPriceEur - buyPrice;
      const currentNet = currentGross > 0 ? (currentGross * (1 - taxRate)) - fees : currentGross - fees;
      const targetGross = targetSellEur - buyPrice;
      const targetNet = targetGross > 0 ? (targetGross * (1 - taxRate)) - fees : targetGross - fees;

      const stocksWithScore = useMemo(() => {
        return stocks.map(s => {
          const { score, drawdown } = computeScore(s);
          return { ...s, score, drawdown };
        }).filter(s => filter === "ALL" || s.envelope === filter)
          .sort((a, b) => b.score - a.score);
      }, [stocks, filter]);

      const savebackBonus = Math.min(15, +(cardSpend * 0.01).toFixed(2));
      const effectiveMonthly = monthlySaving + savebackBonus;

      const projection = useMemo(() => {
        const r = 0.07 / 12;
        const n = years * 12;
        const futureVal = 150 * Math.pow(1 + r, n) + effectiveMonthly * ((Math.pow(1 + r, n) - 1) / r);
        const invested = 150 + monthlySaving * n;
        const freeSavebackTotal = savebackBonus * n;
        const monthlyDividend = (futureVal * 0.05) / 12;

        // Curve points for SVG chart
        const points = [];
        for (let y = 0; y <= years; y++) {
          const m = y * 12;
          const val = 150 * Math.pow(1 + r, m) + effectiveMonthly * ((Math.pow(1 + r, m) - 1) / r);
          const inv = 150 + monthlySaving * m;
          points.push({ year: y, val, inv });
        }
        return { futureVal, invested, freeSavebackTotal, monthlyDividend, points };
      }, [monthlySaving, savebackBonus, effectiveMonthly, years]);

      const addStockToPortfolio = (s) => {
        const exists = portfolio.find(p => p.symbol === s.symbol);
        if (exists) {
          setPortfolio(portfolio.map(p => p.symbol === s.symbol ? { ...p, qty: +(p.qty + 1).toFixed(2) } : p));
        } else {
          setPortfolio([...portfolio, {
            id: Date.now().toString(),
            symbol: s.symbol,
            name: s.name,
            envelope: s.envelope,
            qty: 1.0,
            buyPriceEur: s.priceEur,
            currentPriceEur: s.priceEur,
            divPerShareEur: +(s.priceEur * (s.divYield / 100)).toFixed(2),
            nextDivDate: s.exDivDate
          }]);
        }
        setSelectedStock(null);
        setTab("portfolio");
      };

      const generateLocalSmartAnswer = (question) => {
        const q = question.toLowerCase();
        const topPea = stocksWithScore.filter(s => s.envelope === "PEA")[0];
        const topCto = stocksWithScore.filter(s => s.envelope === "CTO")[0];

        if (q.includes("nvidia") || q.includes("nvda") || q.includes("vendre")) {
          return `📊 Diagnostic Nvidia (achetée à 145,02 €) : Au cours simulé de ${nvdaPriceEur.toFixed(2)} €, ta plus-value nette après Flat Tax (30%) et 2 € de frais est de ${currentNet >= 0 ? "+" : ""}${currentNet.toFixed(2)} €. Avec les résultats records du T3 (115,8 Mds$ de CA, carnet de commandes de 2 500 Mds$ et 150 Mds$ de rachats d'actions), la stratégie optimale est le Buy & Hold vers 185 € (+${((185 - 145.02)*0.7 - 2).toFixed(2)} € net) ou 225 € (+${((225 - 145.02)*0.7 - 2).toFixed(2)} € net). Place simplement une alerte à 220 € sur Trade Republic.`;
        }
        if (q.includes("pea") || q.includes("dividende") || q.includes("passif") || q.includes("225")) {
          return `💰 Plan Revenus Passifs (${monthlySaving} €/mois + ${savebackBonus} € de Saveback gratuit) : Programme 3 plans d'épargne gratuits (bouton "Épargner" à 0 € sur Trade Republic) : 1) ${Math.round(monthlySaving*0.6)} €/mois sur l'ETF Xtrackers Euro Stoxx Quality Dividend (PEA), 2) ${Math.round(monthlySaving*0.2)} €/mois sur ${topPea.name} (PEA, score ${topPea.score}/100, dividende ${topPea.divYield}%), et 3) ${Math.round(monthlySaving*0.2)} €/mois sur Realty Income (CTO, loyer versé chaque mois). En ${years} ans, cela génère ${Math.round(projection.futureVal).toLocaleString()} € de capital et ~${Math.round(projection.monthlyDividend)} €/mois de rente.`;
        }
        return `🎯 Synthèse Radar V3 : La meilleure opportunité PEA actuelle est ${topPea.name} (${topPea.priceEur} €, RSI de Wilder à ${topPea.rsi}, décote de ${topPea.drawdown.toFixed(1)}%, score ${topPea.score}/100). Côté CTO US, ${topCto.name} affiche un score de ${topCto.score}/100 avec un prix cible idéal à ${topCto.targetBuyEur} €.`;
      };

      const handleAskAi = async (customPrompt) => {
        const promptText = customPrompt || chatInput;
        if (!promptText.trim()) return;
        const userMsg = { role: "user", text: promptText };
        setChatHistory(prev => [...prev, userMsg]);
        if (!customPrompt) setChatInput("");

        if (aiMode === "EMBEDDED" || !apiKey.trim()) {
          const reply = generateLocalSmartAnswer(promptText);
          setChatHistory(prev => [...prev, { role: "ai", text: reply }]);
          return;
        }

        setIsLoadingAi(true);
        try {
          const contextStr = `Portefeuille de Victor sur Trade Republic : Nvidia achetée à 145.02€ (cours actuel ${nvdaPriceEur}€). Epargne mensuelle prévue : ${monthlySaving}€/mois. Top actions radar : ${stocksWithScore.slice(0,4).map(s => `${s.name} (Score ${s.score}/100, RSI ${s.rsi}, Div ${s.divYield}%)`).join(", ")}. Réponds de manière concise, directe et chiffrée en français.`;
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: `${contextStr}\n\nQuestion : ${promptText}` }] }]
            })
          });
          const data = await res.json();
          const answer = data?.candidates?.[0]?.content?.parts?.[0]?.text || generateLocalSmartAnswer(promptText);
          setChatHistory(prev => [...prev, { role: "ai", text: answer }]);
        } catch (err) {
          setChatHistory(prev => [...prev, { role: "ai", text: generateLocalSmartAnswer(promptText) }]);
        } finally {
          setIsLoadingAi(false);
        }
      };

      return (
        <div className="min-h-screen pb-28 max-w-5xl mx-auto px-3 sm:px-6 pt-3">
          {/* HEADER BAR */}
          <header className="flex flex-wrap items-center justify-between bg-slate-900/95 border border-slate-800 rounded-2xl p-3.5 mb-4 gap-2 shadow-lg">
            <div>
              <div className="flex items-center gap-2">
                <span className="h-2.5 w-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <h1 className="text-base sm:text-lg font-black tracking-tight text-white">TradePulse Pro V3</h1>
                <span className="text-[10px] font-bold bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full border border-emerald-500/30">Z Fold 8 Edition</span>
              </div>
              <p className="text-[11px] text-slate-400 mt-0.5">Moteur Quantitatif + IA • Trade Republic CTO & PEA</p>
            </div>
            <div className="flex items-center gap-3">
              <button onClick={refreshLivePrices} className="bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 px-3 py-1.5 rounded-xl border border-slate-700 transition">
                {isRefreshing ? "Sync..." : "↻ Actualiser Cours"}
              </button>
              <div className="text-right">
                <div className="text-[10px] text-slate-400">NVDA (Achat 145,02 €)</div>
                <div className={`text-sm font-black ${currentNet >= 0 ? "text-emerald-400" : "text-rose-400"}`}>
                  {currentNet >= 0 ? "+" : ""}{currentNet.toFixed(2)} € net
                </div>
              </div>
            </div>
          </header>

          {/* TAB 1: PORTFOLIO & NVIDIA SIMULATOR */}
          {tab === "portfolio" && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between">
                <div>
                  <div className="flex justify-between items-start mb-3">
                    <div>
                      <span className="text-[10px] uppercase tracking-wider bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-md font-bold">Position Active • CTO</span>
                      <h2 className="text-xl font-black text-white mt-1">Nvidia Corp. (NVDA)</h2>
                      <p className="text-xs text-slate-400">1,00 action achetée à 145,02 € • Dividende le 23/12 (~0,17 € net)</p>
                    </div>
                    <div className="text-right">
                      <div className="text-2xl font-black text-white">{nvdaPriceEur.toFixed(2)} €</div>
                      <div className="text-xs font-bold text-emerald-400">+{(((nvdaPriceEur - buyPrice)/buyPrice)*100).toFixed(1)}%</div>
                    </div>
                  </div>

                  <div className="mb-4 bg-slate-950/60 p-3 rounded-xl border border-slate-800/80">
                    <div className="flex justify-between text-xs text-slate-400 mb-1">
                      <span>Simuler le cours actuel NVDA (€)</span>
                      <span className="text-white font-bold">{nvdaPriceEur.toFixed(2)} € (~{(nvdaPriceEur * 1.08).toFixed(1)} $)</span>
                    </div>
                    <input type="range" min="130" max="245" step="0.5" value={nvdaPriceEur} onChange={e => setNvdaPriceEur(parseFloat(e.target.value))} className="w-full accent-emerald-400" />
                  </div>
                </div>

                <div className="grid grid-cols-3 gap-2 text-center bg-slate-950 p-3 rounded-xl border border-slate-800">
                  <div>
                    <div className="text-[10px] text-slate-400">Prix d'achat</div>
                    <div className="text-sm font-bold text-white">145,02 €</div>
                  </div>
                  <div>
                    <div className="text-[10px] text-slate-400">Stop Zéro Perte</div>
                    <div className="text-sm font-bold text-amber-400">147,02 €</div>
                  </div>
                  <div>
                    <div className="text-[10px] text-slate-400">Gain Net Poche</div>
                    <div className={`text-sm font-black ${currentNet >= 0 ? "text-emerald-400" : "text-rose-400"}`}>
                      {currentNet >= 0 ? "+" : ""}{currentNet.toFixed(2)} €
                    </div>
                  </div>
                </div>
              </div>

              {/* PALIERS DE REVENTE */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <div className="flex justify-between items-center mb-2">
                  <h3 className="text-sm font-bold text-white">Simulateur de Revente Net</h3>
                  <div className="flex gap-1">
                    {["CTO", "PEA"].map(m => (
                      <button key={m} onClick={() => setTaxMode(m)} className={`text-[10px] px-2 py-0.5 rounded font-bold ${taxMode === m ? "bg-indigo-500 text-white" : "bg-slate-800 text-slate-400"}`}>
                        {m === "CTO" ? "CTO (30%)" : "PEA (17,2%)"}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-3 gap-2 mb-3">
                  {[
                    { label: "Court Terme", price: 165, desc: "~181 $ (+12,6€ net)" },
                    { label: "Moyen Terme", price: 185, desc: "~203 $ (+26,6€ net)" },
                    { label: "Long Terme", price: 225, desc: "Record (+54,6€ net)" }
                  ].map(p => (
                    <button key={p.price} onClick={() => setTargetSellEur(p.price)} className={`p-2.5 rounded-xl border text-left transition ${targetSellEur === p.price ? "bg-emerald-500/20 border-emerald-400 text-white" : "bg-slate-950 border-slate-800 text-slate-300"}`}>
                      <div className="text-[10px] text-slate-400">{p.label}</div>
                      <div className="text-base font-black">{p.price} €</div>
                      <div className="text-[10px] text-emerald-400">{p.desc}</div>
                    </button>
                  ))}
                </div>

                <div className="flex justify-between text-xs text-slate-400 mb-1">
                  <span>Objectif de cours cible</span>
                  <span className="text-white font-bold">{targetSellEur.toFixed(2)} €</span>
                </div>
                <input type="range" min="150" max="265" step="1" value={targetSellEur} onChange={e => setTargetSellEur(parseFloat(e.target.value))} className="w-full accent-indigo-400 mb-3" />

                <div className="flex justify-between items-center bg-indigo-500/10 border border-indigo-500/30 rounded-xl p-3">
                  <div>
                    <div className="text-xs font-semibold text-indigo-200">Gain Net en poche à {targetSellEur} €</div>
                    <div className="text-[10px] text-slate-400">Brut: +{targetGross.toFixed(2)} € • Frais TR: 2 € • Fiscalité: {taxMode === "CTO" ? "30%" : "17,2%"}</div>
                  </div>
                  <div className="text-xl font-black text-emerald-400">+{targetNet.toFixed(2)} €</div>
                </div>
              </div>

              {/* LISTE DU PORTEFEUILLE COMPLET */}
              <div className="md:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="text-sm font-bold text-white">Mes Lignes Détenues ({portfolio.length})</h3>
                  <span className="text-[11px] text-slate-400">Clique sur une action dans le Radar pour l'ajouter ici</span>
                </div>
                <div className="space-y-2">
                  {portfolio.map(item => {
                    const pnl = (item.currentPriceEur - item.buyPriceEur) * item.qty;
                    return (
                      <div key={item.id} className="flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="font-bold text-white text-sm">{item.name}</span>
                            <span className="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-emerald-300 font-bold">{item.envelope}</span>
                            <span className="text-xs text-slate-400">Qté: {item.qty}</span>
                          </div>
                          <div className="text-[11px] text-slate-400 mt-0.5">
                            PRU: {item.buyPriceEur.toFixed(2)} € • Cours: {item.currentPriceEur.toFixed(2)} € • Prochain Div: {item.nextDivDate}
                          </div>
                        </div>
                        <div className="text-right">
                          <div className={`text-sm font-black ${pnl >= 0 ? "text-emerald-400" : "text-rose-400"}`}>
                            {pnl >= 0 ? "+" : ""}{pnl.toFixed(2)} €
                          </div>
                          {item.symbol !== "NVDA" && (
                            <button onClick={() => setPortfolio(portfolio.filter(p => p.id !== item.id))} className="text-[10px] text-rose-400 underline mt-0.5">Retirer</button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* TAB 2: SCREENER RADAR V3 */}
          {tab === "screener" && (
            <div className="space-y-3">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <div className="flex gap-2">
                  {["ALL", "PEA", "CTO"].map(f => (
                    <button key={f} onClick={() => setFilter(f)} className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition ${filter === f ? "bg-emerald-500 text-slate-950 border-emerald-400" : "bg-slate-900 text-slate-300 border-slate-800"}`}>
                      {f === "ALL" ? "Toutes (PEA + CTO)" : `Uniquement ${f}`}
                    </button>
                  ))}
                </div>
                <span className="text-[11px] text-slate-400">Toucher une ligne = Fiche d'ordre Trade Republic</span>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {stocksWithScore.map(s => (
                  <div key={s.symbol} onClick={() => setSelectedStock(s)} className="cursor-pointer bg-slate-900 hover:bg-slate-800/90 border border-slate-800 rounded-2xl p-3.5 transition flex flex-col justify-between">
                    <div className="flex items-start justify-between">
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-white text-sm">{s.name}</span>
                          <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${s.envelope === "PEA" ? "bg-indigo-500/20 text-indigo-300" : "bg-amber-500/20 text-amber-300"}`}>{s.envelope}</span>
                          <span className="text-[10px] text-slate-400">{s.category}</span>
                        </div>
                        <p className="text-[11px] text-slate-400 mt-1 line-clamp-2">{s.thesis}</p>
                      </div>
                      <div className="text-right ml-2 shrink-0">
                        <div className={`text-xs font-black px-2.5 py-1 rounded-lg ${s.score >= 60 ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/40" : "bg-slate-800 text-slate-300"}`}>
                          {s.score}/100
                        </div>
                        <div className="text-[10px] font-bold text-emerald-400 mt-1">{s.score >= 60 ? "ACHAT FORT" : "SURVEILLER"}</div>
                      </div>
                    </div>

                    <div className="mt-3 pt-2.5 border-t border-slate-800/80 grid grid-cols-4 gap-1 text-center text-[11px]">
                      <div>
                        <span className="text-slate-400 block text-[10px]">Cours</span>
                        <b className="text-white">{s.priceEur.toFixed(2)} €</b>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">Cible Achat</span>
                        <b className="text-emerald-400">{s.targetBuyEur.toFixed(2)} €</b>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">RSI Wilder</span>
                        <b className={s.rsi < 38 ? "text-emerald-400" : "text-slate-200"}>{s.rsi}</b>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">Div ({s.exDivDate})</span>
                        <b className="text-indigo-300">{s.divYield}%</b>
                      </div>
                    </div>
                  </div>
                ))}
              </div>

              {/* MODAL FICHE D'ORDRE TRADE REPUBLIC */}
              {selectedStock && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50" onClick={() => setSelectedStock(null)}>
                  <div className="bg-slate-900 border border-slate-700 rounded-2xl p-5 max-w-md w-full space-y-3" onClick={e => e.stopPropagation()}>
                    <div className="flex justify-between items-start">
                      <div>
                        <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300">Plan d'exécution Trade Republic • {selectedStock.envelope}</span>
                        <h3 className="text-lg font-black text-white mt-1">{selectedStock.name} ({selectedStock.symbol})</h3>
                      </div>
                      <button onClick={() => setSelectedStock(null)} className="text-slate-400 hover:text-white text-sm font-bold">✕</button>
                    </div>
                    <p className="text-xs text-slate-300 leading-relaxed">{selectedStock.thesis}</p>
                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-1.5 text-xs">
                      <div className="flex justify-between"><span>Type d'enveloppe :</span><b className="text-white">{selectedStock.envelope} Trade Republic</b></div>
                      <div className="flex justify-between"><span>Ordre ponctuel (Bouton Acheter) :</span><b className="text-emerald-400">Cours limité à {selectedStock.targetBuyEur.toFixed(2)} €</b></div>
                      <div className="flex justify-between"><span>Plan programmé (Bouton Épargner) :</span><b className="text-indigo-300">0 € de frais (Mensuel)</b></div>
                      <div className="flex justify-between"><span>Moyenne Mobile 200j (SMA200) :</span><b className="text-slate-200">{selectedStock.sma200} {selectedStock.currency}</b></div>
                    </div>
                    <div className="flex gap-2 pt-2">
                      <button onClick={() => addStockToPortfolio(selectedStock)} className="flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs py-2.5 rounded-xl transition">
                        + Ajouter à mon Portefeuille
                      </button>
                      <button onClick={() => setSelectedStock(null)} className="px-4 bg-slate-800 text-slate-300 font-bold text-xs py-2.5 rounded-xl">
                        Fermer
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* TAB 3: MACHINE A REVENUS PASSIFS (150 - 300€) */}
          {tab === "passive" && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                <div>
                  <h2 className="text-base font-black text-white">Machine à Revenus Passifs (Effet Boule de Neige)</h2>
                  <p className="text-xs text-slate-400">Plans d'épargne programmés Trade Republic (0 € de frais) + Saveback 1 %</p>
                </div>

                <div>
                  <div className="flex justify-between text-xs mb-1">
                    <span className="text-slate-400">Épargne mensuelle programmée</span>
                    <span className="font-black text-emerald-400">{monthlySaving} € / mois</span>
                  </div>
                  <input type="range" min="50" max="600" step="25" value={monthlySaving} onChange={e => setMonthlySaving(parseInt(e.target.value))} className="w-full accent-emerald-400" />
                </div>

                <div>
                  <div className="flex justify-between text-xs mb-1">
                    <span className="text-slate-400">Dépenses Carte Trade Republic (Saveback 1% gratuit)</span>
                    <span className="font-bold text-amber-400">+{savebackBonus} € offerts / mois</span>
                  </div>
                  <input type="range" min="0" max="1500" step="100" value={cardSpend} onChange={e => setCardSpend(parseInt(e.target.value))} className="w-full accent-amber-400" />
                </div>

                <div>
                  <div className="flex justify-between text-xs mb-1">
                    <span className="text-slate-400">Horizon de temps</span>
                    <span className="font-bold text-indigo-400">{years} ans</span>
                  </div>
                  <input type="range" min="3" max="25" step="1" value={years} onChange={e => setYears(parseInt(e.target.value))} className="w-full accent-indigo-400" />
                </div>

                <div className="grid grid-cols-3 gap-2 text-center bg-slate-950 p-3 rounded-xl border border-slate-800">
                  <div>
                    <div className="text-[10px] text-slate-400">Versé Poche</div>
                    <div className="text-sm font-bold text-slate-200">{Math.round(projection.invested).toLocaleString()} €</div>
                  </div>
                  <div>
                    <div className="text-[10px] text-slate-400">Capital Final</div>
                    <div className="text-sm font-black text-white">{Math.round(projection.futureVal).toLocaleString()} €</div>
                  </div>
                  <div>
                    <div className="text-[10px] text-slate-400">Rente Passive</div>
                    <div className="text-sm font-black text-emerald-400">{Math.round(projection.monthlyDividend)} € / mois</div>
                  </div>
                </div>
              </div>

              {/* ALLOCATION & CALENDRIER DES 12 MOIS */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-bold text-white">Répartition Mensuelle ({monthlySaving} €)</h3>
                  <div className="flex gap-1">
                    {[
                      { id: "EQUILIBRE", label: "Équilibré" },
                      { id: "RENTE", label: "100% Rente" }
                    ].map(p => (
                      <button key={p.id} onClick={() => setProfileType(p.id)} className={`text-[10px] px-2 py-0.5 rounded font-bold ${profileType === p.id ? "bg-emerald-500 text-slate-950" : "bg-slate-800 text-slate-400"}`}>
                        {p.label}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="space-y-2 text-xs">
                  <div className="flex justify-between p-2.5 bg-slate-950 rounded-xl border border-slate-800">
                    <span><b>{profileType === "EQUILIBRE" ? "60%" : "50%"} PEA</b> • ETF Xtrackers Euro Quality Div</span>
                    <span className="font-bold text-emerald-400">{Math.round(monthlySaving * (profileType === "EQUILIBRE" ? 0.6 : 0.5))} € / mois</span>
                  </div>
                  <div className="flex justify-between p-2.5 bg-slate-950 rounded-xl border border-slate-800">
                    <span><b>{profileType === "EQUILIBRE" ? "20%" : "30%"} PEA</b> • TotalEnergies + AXA</span>
                    <span className="font-bold text-indigo-400">{Math.round(monthlySaving * (profileType === "EQUILIBRE" ? 0.2 : 0.3))} € / mois</span>
                  </div>
                  <div className="flex justify-between p-2.5 bg-slate-950 rounded-xl border border-slate-800">
                    <span><b>20% CTO</b> • Realty Income (Dividende Mensuel)</span>
                    <span className="font-bold text-amber-400">{Math.round(monthlySaving * 0.2)} € / mois</span>
                  </div>
                </div>

                <div>
                  <h4 className="text-xs font-bold text-slate-300 mb-2">Calendrier des 12 Mois de Versements (à {years} ans)</h4>
                  <div className="grid grid-cols-4 gap-1.5 text-center">
                    {MONTHS.map(item => {
                      const amt = Math.round(projection.monthlyDividend * item.weight);
                      return (
                        <div key={item.m} className="bg-slate-950 border border-slate-800 rounded-lg p-1.5">
                          <div className="text-[10px] text-slate-400 font-bold">{item.m}</div>
                          <div className="text-xs font-black text-emerald-400">+{amt} €</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* TAB 4: COACH IA & BRIEFING (SANS OLLAMA) */}
          {tab === "ai" && (
            <div className="space-y-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                  <div>
                    <h2 className="text-base font-black text-white">Coach IA & Moteur Quantitatif Embarqué</h2>
                    <p className="text-xs text-slate-400">100 % autonome sur ton Z Fold 8 (aucun serveur PC / Ollama requis)</p>
                  </div>
                  <div className="flex gap-1.5">
                    <button onClick={() => setAiMode("EMBEDDED")} className={`px-3 py-1 rounded-xl text-xs font-bold ${aiMode === "EMBEDDED" ? "bg-emerald-500 text-slate-950" : "bg-slate-800 text-slate-300"}`}>
                      Moteur Embarqué (Hors-ligne)
                    </button>
                    <button onClick={() => setAiMode("CLOUD")} className={`px-3 py-1 rounded-xl text-xs font-bold ${aiMode === "CLOUD" ? "bg-indigo-500 text-white" : "bg-slate-800 text-slate-300"}`}>
                      Cloud Gemini API
                    </button>
                  </div>
                </div>

                {aiMode === "CLOUD" && (
                  <div className="mb-3 bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <label className="block text-[11px] text-slate-400 mb-1">Clé API Google AI Studio (Optionnelle — stockée uniquement sur ton téléphone) :</label>
                    <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="Colle ta clé AIzaSy... (ou laisse vide pour utiliser le moteur embarqué)" className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white" />
                  </div>
                )}

                {/* BOUTONS D'ANALYSE RAPIDE */}
                <div className="flex flex-wrap gap-2 mb-3">
                  {[
                    "Analyser ma ligne Nvidia (145,02 €)",
                    "Où placer mes 225 € ce mois-ci ?",
                    "Quelle est la meilleure action PEA en solde ?"
                  ].map(q => (
                    <button key={q} onClick={() => handleAskAi(q)} className="text-xs bg-slate-800 hover:bg-slate-700 text-emerald-300 border border-slate-700 px-3 py-1.5 rounded-xl font-semibold transition">
                      ⚡ {q}
                    </button>
                  ))}
                </div>

                {/* HISTORIQUE CONVERSATION */}
                <div className="bg-slate-950 border border-slate-800 rounded-xl p-3 h-64 overflow-y-auto space-y-2.5 mb-3">
                  {chatHistory.map((m, idx) => (
                    <div key={idx} className={`p-3 rounded-xl text-xs leading-relaxed ${m.role === "user" ? "bg-indigo-600/20 border border-indigo-500/30 text-indigo-100 ml-8" : "bg-slate-900 border border-slate-800 text-slate-200 mr-4"}`}>
                      <div className="text-[10px] font-bold uppercase text-emerald-400 mb-1">{m.role === "user" ? "Toi" : "TradePulse IA"}</div>
                      {m.text}
                    </div>
                  ))}
                  {isLoadingAi && <div className="text-xs text-emerald-400 animate-pulse">Analyse en cours...</div>}
                </div>

                <div className="flex gap-2">
                  <input type="text" value={chatInput} onChange={e => setChatInput(e.target.value)} onKeyDown={e => e.key === "Enter" && handleAskAi()} placeholder="Pose ta question sur Nvidia, ton PEA, tes dividendes..." className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-white" />
                  <button onClick={() => handleAskAi()} className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs px-4 py-2 rounded-xl">
                    Envoyer
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* BOTTOM NAVIGATION BAR (4 ONGLET COMPLETS) */}
          <nav className="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 flex justify-around py-2.5 px-2 max-w-5xl mx-auto z-40">
            {[
              { id: "portfolio", label: "1. Portefeuille NVDA" },
              { id: "screener", label: "2. Radar & Ordres" },
              { id: "passive", label: "3. Rente 12 Mois" },
              { id: "ai", label: "4. Coach IA" }
            ].map(item => (
              <button key={item.id} onClick={() => setTab(item.id)} className={`px-3 py-1.5 rounded-xl text-xs font-black transition ${tab === item.id ? "bg-emerald-500 text-slate-950 shadow" : "text-slate-400 hover:text-white"}`}>
                {item.label}
              </button>
            ))}
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
